@if (product(); as product) {
  @switch (step()) {
    @case (SubscriptionStep.Tariffs) {
      <app-tariff-modal
        [product]="product"
        (tariffSelected)="onSelectTariff($event)"
        (closed)="onClose()"
      />
    }
    @case (SubscriptionStep.Payment) {
      @if (tariff(); as tariff) {
        <app-payment-modal
          [product]="product"
          [tariff]="tariff"
          (pay)="onPay()"
          (back)="onBackToTariffs()"
          (closed)="onClose()"
        />
      }
    }
    @case (SubscriptionStep.Success) {
      <app-success-modal
        [product]="product"
        [step]="successStep()"
        (next)="onNextSuccessStep()"
        (back)="onBackToFirstSuccessStep()"
        (finish)="onClose()"
      />
    }
  }
}
