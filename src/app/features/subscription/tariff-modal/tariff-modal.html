<app-modal pagination="1/3" (closed)="closed.emit()">
  <span modalTitle class="mb-4 block text-2xl leading-snug font-bold text-black">
    {{ product().name }}
  </span>

  <div class="my-5 flex flex-col gap-2.5">
    @for (tariff of product().tariffs; track tariff.id) {
      <button
        type="button"
        class="flex cursor-pointer items-center justify-between rounded-[10px] border-[1.5px] bg-transparent px-4 py-3.5 text-left"
        [class.border-border]="selectedTariffId() !== tariff.id"
        [class.border-brand]="selectedTariffId() === tariff.id"
        (click)="selectedTariffId.set(tariff.id)"
      >
        <span class="font-semibold">{{ tariff.label }}</span>
        <span>
          @if (tariff.priceUsdOld) {
            <span class="mr-1.5 text-muted line-through">${{ tariff.priceUsdOld }}</span>
          }
          ${{ tariff.priceUsd }} / {{ tariff.period }}
        </span>
      </button>
    }
  </div>

  <button modalCta type="button" class="btn-brand justify-self-end" (click)="onNext()">
    {{ 'tariff.next' | translate }}
  </button>
</app-modal>
